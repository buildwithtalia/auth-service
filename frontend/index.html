<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Service</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Auth Service</h1>
      <p class="subtitle">Login / Logout demo frontend</p>
    </header>

    <section id="auth-view">
      <div class="tabs">
        <button class="tab active" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
      </div>

      <form id="login-form" class="form active">
        <label>
          Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>
          Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit">Log in</button>
      </form>

      <form id="register-form" class="form">
        <label>
          Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>
          Password
          <input type="password" name="password" required autocomplete="new-password" />
          <small class="hint">
            8-128 chars, must include uppercase, lowercase, number, and special character (@$!%*?&)
          </small>
        </label>
        <button type="submit">Create account</button>
      </form>
    </section>

    <section id="profile-view" hidden>
      <h2>Welcome</h2>
      <dl class="profile">
        <dt>Email</dt><dd id="profile-email">-</dd>
        <dt>User ID</dt><dd id="profile-id">-</dd>
        <dt>Last login</dt><dd id="profile-last-login">-</dd>
        <dt>Created</dt><dd id="profile-created">-</dd>
      </dl>
      <button id="logout-btn">Log out</button>
    </section>

    <div id="message" class="message" hidden></div>

    <footer>
      <small>
        Login service: <code>localhost:3001</code> &middot;
        Logout service: <code>localhost:3002</code>
      </small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
